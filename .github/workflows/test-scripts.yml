# Shell-script unit tests for publish-charts.yml logic.
#
# Runs bats-core against scripts under .github/scripts/ using fixtures
# under test/bats/fixtures/. Also runs shellcheck on every script.
# Triggers on PRs that touch any of the covered paths.

name: Shell-script unit tests

on:
  pull_request:
    branches:
      - main
    # Deliberately NOT path-filtered, unlike the push trigger below.
    # `bats` is a required branch-protection status check -- a path
    # filter here means it silently never runs (not pass, not fail, just
    # absent) for any PR that doesn't happen to touch these exact paths,
    # which GitHub's required-status-checks treats as permanently
    # unsatisfied, blocking the merge of an otherwise-unrelated PR.
    # Found live (2026-10-03) on the CODEOWNERS PR. The suite runs in
    # under a second per its own README -- no real cost to running it on
    # every PR, and it removes this whole class of self-inflicted lockout.
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - 'test/bats/**'

permissions: {}

jobs:
  bats:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - name: Install bats + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck

      - name: Install yq v4
        run: |
          # yq v4 is a Go binary from mikefarah/yq, pre-installed on ubuntu-24.04.
          # Verify it's the Go v4, not the Python-era v3.
          yq --version
          yq --version | grep -q 'version v4' || { echo "::error::yq v4 required"; exit 1; }

      - name: Shellcheck all scripts
        run: shellcheck .github/scripts/*.sh

      - name: Run bats
        run: bats --print-output-on-failure test/bats/
